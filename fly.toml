app = "zveltio"
primary_region = "ams"

# The Dockerfile's default target (`standalone`) starts as root: the extension
# runner runs in the machine beside the engine, which drops to uid 100.
# Third-party extensions run only on that runner in production.
[build]
  dockerfile = "Dockerfile"

# One machine. The image runs in single-instance mode (no Valkey), so a second
# machine would only stand by: deploy with `fly deploy --ha=false`, or
# `fly scale count 1`. To run several, add Valkey (`fly redis create`) and set
# its URL as the VALKEY_URL secret.
# Secrets: `fly secrets set DATABASE_URL=... BETTER_AUTH_SECRET=$(openssl rand -hex 32)`.
# PostgreSQL 18 or newer is required.
[env]
  PORT = "8080"
  # The URL browsers use; change it with the app name.
  BETTER_AUTH_URL = "https://zveltio.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
