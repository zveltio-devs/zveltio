name: zveltio

# Opt-in overlay that adds Electric 1.x (HTTP Shape API) beside the core stack.
#
#   docker compose -f docker-compose.yml -f docker-compose.electric.yml up
#
# Requires ELECTRIC_SECRET in .env (generate with: openssl rand -hex 32).
#
# Electric is reachable ONLY from the engine: no published port, and every shape
# request needs the secret, which clients never see. Clients sync through
# `GET /api/electric/v1/shape`, where the engine decides the table, rows and
# columns from the caller's grants, tenant, row rules and column permissions
# (docs/engine/offline-sync.md). Electric itself reads as a role that bypasses
# RLS — exposing it directly would serve every tenant's rows.
#
# Electric creates its own publication and replication slot on first start and
# sets REPLICA IDENTITY FULL on a table when a shape first asks for it; the db
# service already runs with wal_level=logical. An Electric that is stopped for
# good must have its slot dropped (`SELECT pg_drop_replication_slot(
# 'electric_slot_default')`), or Postgres keeps WAL for it without limit.

services:
  electric:
    image: electricsql/electric:1.8.1
    container_name: zveltio-electric
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Directly to Postgres, not through PgDog: logical replication needs a
      # replication connection the pooler does not carry.
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-zveltio}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-zveltio}?sslmode=disable'
      ELECTRIC_SECRET: '${ELECTRIC_SECRET:?ERROR: ELECTRIC_SECRET must be set in .env}'
      ELECTRIC_PORT: '3000'
      ELECTRIC_STORAGE_DIR: /var/lib/electric
    volumes:
      - electric_data:/var/lib/electric
    # No `ports:` on purpose — see the header.
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:3000/v1/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - zveltio_internal

  engine:
    environment:
      ELECTRIC_URL: 'http://electric:3000'
      ELECTRIC_SECRET: '${ELECTRIC_SECRET:?ERROR: ELECTRIC_SECRET must be set in .env}'
    depends_on:
      electric:
        condition: service_healthy

volumes:
  electric_data:
