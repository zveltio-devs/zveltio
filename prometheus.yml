global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'zveltio-engine'
    static_configs:
      - targets: ['engine:3000']
    metrics_path: '/metrics'
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
