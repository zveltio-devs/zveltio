name: Client

# The public client host had zero automated tests. This workflow runs its
# vitest component suite (jsdom, no DB/engine) so a broken public renderer —
# e.g. a regression in the CMS block sanitization — is caught in CI rather
# than in production. Scoped via `paths` so engine-only PRs don't pay the cost.
#
# Only the test suite runs here (not `check`): the SvelteKit svelte-check pass
# has pre-existing type gaps in the routes that are tracked separately.

on:
  push:
    branches: [main, master]
  pull_request:
    paths:
      - 'packages/client/**'
      - 'packages/sdk/**'
      - 'bun.lock'
      - 'package.json'
      - '.github/workflows/client.yml'

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SDK
        # The client imports from `@zveltio/sdk` (dist), so compile it first.
        run: cd packages/sdk && bun run build

      - name: SvelteKit sync
        # Generates .svelte-kit/tsconfig.json, which the client tsconfig
        # extends. Without it esbuild fails to resolve a tsconfig when
        # transforming tests/setup.ts (TSCONFIG_ERROR: Tsconfig not found).
        run: cd packages/client && bunx svelte-kit sync

      - name: Component tests
        run: cd packages/client && bun run test
