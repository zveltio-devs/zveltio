name: DR Smoke

# Weekly disaster-recovery smoke test: proves that pg_dump produces a
# restorable artifact against the current migration set.
#
# Why this exists: a backup nobody has restored is an assumption, and a
# regression that makes the dump unrestorable would otherwise surface the
# next time someone runs a manual drill — which is to say, during an
# outage.
#
# This used to reimplement the drill inline, comparing two row counts,
# on the reasoning that the real one "needs a live engine + admin
# credentials — not a fit for CI". It already booted an engine and threw
# it away; keeping it and signing up an admin is a dozen lines. So it now
# runs `scripts/dr-drill.sh`, the same script an operator runs by hand.
#
# That matters beyond tidiness. The inline version compared the tenants
# and settings tables and nothing else, and the script it cited as
# evidence had never been executed by anyone: it aborted on its first
# command, and CI never called it to find out. One definition of what a
# good restore looks like, exercised weekly, is the point.

on:
  schedule:
    # Mondays 04:00 UTC — quiet window, gives us an early-week signal.
    - cron: '0 4 * * 1'
  workflow_dispatch: # allow ad-hoc runs from the Actions UI
  pull_request:
    # Also on changes to the backup path itself, because weekly is the wrong
    # cadence for the one job that runs a REAL dump.
    #
    # Everything else that touches backups is a fake: the unit suites stub
    # `Bun.spawn`, and `dr-drill.sh` reimplements `pg_dump | gzip` in shell
    # rather than calling the product's code. So a regression in the actual
    # pipeline could merge on a green board and surface at restore time — which
    # is the one moment nobody can afford to find out. It nearly did: both backup
    # paths ran for months without checking gzip's exit code, and a truncated
    # archive was recorded as `completed`.
    #
    # Path-filtered, so this costs a job only on the PRs that can break it.
    paths:
      - 'packages/engine/src/lib/backup/**'
      - 'packages/engine/src/routes/backup.ts'
      - 'packages/engine/src/db/migrations/**'
      - 'scripts/dr-drill.sh'
      - '.github/workflows/dr-smoke.yml'

permissions:
  contents: read

jobs:
  dump-restore-roundtrip:
    name: pg_dump + restore round-trip
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zveltio_drill
          POSTGRES_USER: postgres
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      # PGDATABASE is what psql/pg_dump fall back to when no -d / positional
      # database is passed. Without this, the seed + source-count steps below
      # connect to the default `postgres` DB and miss the schema entirely.
      PGDATABASE: zveltio_drill
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zveltio_drill
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - name: Install Postgres 18 client tools
        # The `pgvector/pgvector:pg18` image only ships the server.
        # Ubuntu 24.04's default `postgresql-client` is pg16 — pg_dump 16
        # refuses to dump a pg18 server ("aborting because of server
        # version mismatch"). Pull the matching client from PGDG.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SDK (engine migrations import from it)
        run: cd packages/sdk && bun run build

      - name: Apply migrations to source DB
        # No standalone "migrate" script — the migration runner is wired into
        # initDatabase(). Spin up the engine briefly; it applies migrations on
        # boot under an advisory lock and exits 0 once /api/health responds.
        # It stays up: the drill needs a live engine to sign in against.
        run: |
          cd packages/engine
          BETTER_AUTH_SECRET=$(openssl rand -hex 32) \
          ENCRYPTION_KEY=$(openssl rand -base64 32) \
          ZVELTIO_REGISTRATION_ENABLED=1 \
          bun src/index.ts &
          ENGINE_PID=$!
          # wait up to 60s for /api/health to come up
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health >/dev/null 2>&1; then
              echo "engine boot ok"; break
            fi
            sleep 1
          done
          # Left running: the drill signs in and makes an authenticated request,
          # which is the half that proves a restored instance actually serves.
          echo "ENGINE_PID=$ENGINE_PID" >> "$GITHUB_ENV"

      - name: Seed a minimal data set so the dump exercises rows, not just DDL
        # 1 tenant, 1 user, 1 collection, 1 settings row. Enough that an empty
        # dump would obviously be wrong.
        run: |
          psql -c "INSERT INTO zv_tenants (slug, name) VALUES ('dr-smoke', 'DR Smoke');"
          psql -c "INSERT INTO zv_settings (key, value, description) VALUES ('dr.smoke', '\"ok\"'::jsonb, 'inserted by dr-smoke workflow');"

      - name: Create the admin account the drill signs in as
        run: |
          curl -fsS -X POST http://localhost:3000/api/auth/sign-up/email \
            -H 'content-type: application/json' \
            -d '{"email":"dr-smoke@zveltio.local","password":"DrSmoke12345!","name":"DR Smoke"}' \
            >/dev/null
          psql -c "UPDATE \"user\" SET role='god' WHERE email='dr-smoke@zveltio.local';"

      - name: Run the disaster-recovery drill
        # The same script an operator runs by hand, so there is one definition
        # of what a good restore looks like. It compares row counts across every
        # table, checks that RLS policies and FORCE survive the round trip,
        # confirms the zveltio_rls role is reachable, and then reads the
        # restored data as that role with a tenant in the GUC — which is what
        # proves the restore is usable rather than merely present.
        env:
          ZVELTIO_ENV: drill
          DRILL_DB: zveltio_drill
          DRILL_DB_USER: postgres
          DRILL_BASE_URL: http://localhost:3000
          DRILL_ADMIN_EMAIL: dr-smoke@zveltio.local
          DRILL_ADMIN_PASSWORD: 'DrSmoke12345!'
        run: bash scripts/dr-drill.sh

      - name: Publish the drill report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dr-drill-report-${{ github.run_id }}
          path: docs/dr-drills/*.md
          retention-days: 30

      - name: Dump source DB for forensics
        if: failure()
        run: pg_dump -Fc -f /tmp/dr-smoke.dump zveltio_drill

      - name: Save dump as artifact (for forensic on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dr-smoke-dump-${{ github.run_id }}
          path: /tmp/dr-smoke.dump
          retention-days: 7
