name: Studio

# Studio isn't currently part of the main CI workflow — it only gets
# built indirectly via the Build Check on push-to-master. That means
# Svelte 5 / Paraglide regressions can land in feature PRs without
# being caught until they hit master. This workflow runs the studio
# specifically on every PR + push, with the per-extension i18n merge
# and the same SvelteKit build the production binary embeds.
#
# Scoped via `paths` so PRs that only touch engine code don't pay the
# Studio CI cost.

on:
  push:
    branches: [main, master]
  pull_request:
    paths:
      - 'packages/studio/**'
      - 'packages/engine/**'
      - 'e2e/setup/**'
      - 'packages/sdk/**'
      - 'bun.lock'
      - 'package.json'
      - '.github/workflows/studio.yml'

concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio:
    name: Studio typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SDK
        # Studio imports from `@zveltio/sdk` (dist), so the SDK has to
        # be compiled before the studio's tsc / vite picks it up.
        run: cd packages/sdk && bun run build

      - name: Merge per-extension i18n messages + compile Paraglide
        run: cd packages/studio && bun run i18n:compile

      - name: SvelteKit sync
        # Generates .svelte-kit/tsconfig.json (which the studio's
        # tsconfig.json extends) + $app/* type aliases. Without this,
        # tsc --noEmit can't resolve $app/paths, $lib/*.svelte.js, vite
        # config types, etc.
        run: cd packages/studio && bunx svelte-kit sync

      - name: Typecheck
        # `svelte-check --fail-on-warnings`, not just errors. The 40 warnings this
        # started with were almost all `a11y_label_has_associated_control` — a
        # `<label>` with no `for`, so a screen reader announces the field as
        # unlabelled and clicking the label does not focus it. For a product sold
        # to public institutions that is a procurement question, not a nit.
        #
        # They are at zero. The bar is set here so the next one is a build failure
        # rather than a number that drifts upward one commit at a time.
        run: cd packages/studio && bun run typecheck

      - name: Component tests
        # Vitest + @testing-library/svelte component tests (sanitizer,
        # shared UI, page-builder BlockPreview XSS guard). Previously these
        # existed but ran nowhere in CI — a green build could ship a broken
        # component. jsdom-based, no DB or engine needed.
        run: cd packages/studio && bun run test

      - name: Verify contributions registry
        # PR runners often lack the extensions sibling checkout; the committed
        # `.contributions.generated.ts` must match `.synced.json` or vite
        # build fails on stale import paths.
        run: cd packages/studio && bun scripts/check-contributions-registry.ts

      - name: Build
        # `bun run build` for the studio runs:
        #   - prebuild: sync-extensions + check-contributions-registry + i18n:merge + paraglide compile
        #   - vite build (SvelteKit + adapter-static → dist/)
        # On a PR runner without zveltio-extensions checked out
        # alongside, sync-extensions logs "No extension directory
        # found — skipping" and proceeds with the routes that are
        # already committed under packages/studio/src/routes/(admin)/.
        run: cd packages/studio && bun run build

      - name: Studio dist version marker
        env:
          REQUIRE_STUDIO_DIST: '1'
        run: bun run check:studio-embed

  studio-integration:
    name: Studio integration (pages vs live engine)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Every admin page test under `src/routes/(admin)/**` mocks `$lib/api.js`,
    # so it asserts against a shape a human typed. This lane mounts the same
    # pages with the REAL client against a real engine, which is the only thing
    # in CI that notices a route whose response moved under a page. The browser
    # suite would see it too, but it is deliberately ten journeys, not 79 pages.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SDK
        run: cd packages/sdk && bun run build

      - name: Merge per-extension i18n messages + compile Paraglide
        run: cd packages/studio && bun run i18n:compile

      - name: SvelteKit sync
        run: cd packages/studio && bunx svelte-kit sync

      - name: Boot the engine
        # Reuses the E2E boot (fresh database, migrate, `create-god`), minus the
        # Studio build: this lane mounts pages from source through vite and
        # never fetches `studio-dist`.
        env:
          BOOT_WITHOUT_STUDIO: '1'
          E2E_PORT: '3399'
          E2E_DB: zveltio_studio_it
          E2E_PG_ADMIN: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          bun e2e/setup/boot.ts > /tmp/engine.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:3399/health >/dev/null && exit 0
            sleep 3
          done
          echo "engine never became healthy:"; tail -50 /tmp/engine.log; exit 1

      - name: Run the integration lane
        # No skip-on-missing-engine path here on purpose: this suite reporting
        # green because it quietly did nothing is the failure mode the extension
        # contract suite already taught this repository.
        run: cd packages/studio && bun run test:integration

      - name: Engine log
        if: failure()
        run: tail -200 /tmp/engine.log
