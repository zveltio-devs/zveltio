name: E2E

# Deliberately separate from CI, and deliberately not a required check.
#
# End-to-end tests are the flakiest kind there is: they depend on timing, a real
# browser, and a database that has to come up in the right order. This
# repository has already lost a release to a race inside a UNIT test — putting a
# browser suite in front of every merge would be paid for daily, and the way
# that debt gets settled is by people learning to re-run until green, which
# costs more than the suite is worth.
#
# So it runs on master and before a release, where a failure is information
# rather than an obstacle. If it starts finding things regularly, promoting it
# to a required check is a decision worth making then, with evidence.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Clone zveltio-extensions
        # Studio prebuild syncs slot widgets (ReceivablesCard) from the sibling
        # repo. Without it, vite build alone ships no CRM dashboard contribution.
        env:
          GH_TOKEN: ${{ secrets.EXTENSIONS_REPO_TOKEN }}
        run: |
          EXT_DIR="${{ github.workspace }}/../zveltio-extensions"
          TOKEN="${GH_TOKEN:-${{ github.token }}}"
          git clone --depth 1 \
            "https://x-access-token:${TOKEN}@github.com/zveltio-devs/zveltio-extensions.git" \
            "$EXT_DIR"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - run: bun install

      # The same sequence the Studio workflow uses, and for the same reasons:
      # the SDK's `dist/` and paraglide's output are both gitignored, so they
      # exist on a workstation and never on a clean checkout. Skipping either
      # fails the build on a module that resolves fine locally — which is how
      # this job failed its first two runs.
      #
      # Built HERE rather than reused: the suite exists partly to notice a
      # Studio bundled for a different engine, so it must not boot against
      # whatever happens to be lying around.
      - name: Build the SDK
        run: cd packages/sdk && bun run build

      - name: Compile the message catalogue
        run: cd packages/studio && bun run i18n:compile

      - name: SvelteKit sync
        run: cd packages/studio && bun x svelte-kit sync

      - name: Build the Studio (with extension sync)
        working-directory: packages/studio
        env:
          EXTENSIONS_DIR: ${{ github.workspace }}/../zveltio-extensions
        # Full `bun run build` so prebuild runs sync-extensions + message merge.
        # Previously this used bare `vite build` to avoid a missing sibling; CI
        # now clones zveltio-extensions above.
        run: |
          bun run build
          bun scripts/stamp-version.ts

      - name: Install Chromium
        # `--with-deps` needs root, which the runner has. Without the system
        # libraries Chromium exits 127 and every browser test fails with a stack
        # trace about process spawning.
        run: bun x playwright install --with-deps chromium

      - name: Run the smoke suite
        env:
          CI: 'true'
          E2E_PG_ADMIN: postgres://postgres:postgres@localhost:5432/postgres
          EXTENSIONS_DIR: ${{ github.workspace }}/../zveltio-extensions
          ZVELTIO_EXTENSIONS: crm
        run: bun x playwright test

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
