name: Deploy artifacts

# Runs what an operator runs: build the image, render the chart, parse the
# compose file. Nothing did before — the image was built only at release, with
# continue-on-error — and E09 found a chart no kubelet would start, a network
# policy that cut the engine off from its database and an installer that could
# not download a release.

on:
  push:
    branches: [master]
  pull_request:
    # The image builds from every package and the root manifests, so a change
    # to any of them can break the build or drop the `migrate` subcommand;
    # without these a PR found out only after merge, on master.
    paths:
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - 'turbo.json'
      - 'Dockerfile'
      - '.dockerignore'
      - 'charts/**'
      - 'docker-compose*.yml'
      - 'prometheus.yml'
      - 'grafana/**'
      - 'install/**'
      - 'scripts/install.sh'
      - 'scripts/generate-compose.sh'
      - '.github/workflows/deploy-artifacts.yml'

permissions:
  contents: read

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install helm + kubeconform
        run: |
          curl -fsSL https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz | tar xz -C /tmp
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C /tmp
      - name: Lint, render, validate
        run: |
          H=/tmp/linux-amd64/helm
          A="--set engine.config.betterAuthSecret=x --set engine.config.betterAuthUrl=https://zv.example --set engine.config.valkeyUrl=redis://cache:6379"
          $H lint charts/zveltio $A
          $H template t charts/zveltio $A > default.yaml
          $H template t charts/zveltio $A \
            --set postgresql.enabled=true --set postgresql.auth.password=p \
            --set redis.enabled=true --set ingress.enabled=true \
            --set podDisruptionBudget.enabled=true --set migrationJob.enabled=true \
            --set autoscaling.enabled=true --set persistence.accessMode=ReadWriteMany \
            > full.yaml
          grep -q 'name: ext-runner$' default.yaml || { echo "::error::the default renders no extension runner"; exit 1; }
          $H template t charts/zveltio $A --set extRunner.enabled=false > restricted.yaml
          ! grep -q 'name: ext-runner$' restricted.yaml || { echo "::error::extRunner.enabled=false still rendered a runner"; exit 1; }
          /tmp/kubeconform -strict -summary default.yaml full.yaml restricted.yaml
      - name: Refuse multi-replica on a ReadWriteOnce claim
        run: |
          A="--set engine.config.betterAuthSecret=x --set engine.config.betterAuthUrl=https://zv.example --set engine.config.valkeyUrl=redis://cache:6379"
          if /tmp/linux-amd64/helm template t charts/zveltio $A --set engine.replicaCount=2 >/dev/null 2>&1; then
            echo "::error::replicaCount=2 with the default RWO PVC rendered; the guard is gone"
            exit 1
          fi

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build (amd64, not pushed)
        # `production` is what release.yml publishes; the default target
        # (`standalone`) is what fly.toml, railway.json and render.yaml build.
        run: |
          docker build --target production -t zveltio-engine:ci .
          docker build -t zveltio-engine:standalone .
      - name: Check what the chart and compose rely on
        run: |
          # Numeric USER: the kubelet cannot verify runAsNonRoot for a name.
          user=$(docker inspect -f '{{.Config.User}}' zveltio-engine:ci)
          [[ "$user" =~ ^[0-9]+(:[0-9]+)?$ ]] || { echo "::error::USER is '$user', not numeric"; exit 1; }
          # Static files outside /data, where a volume would hide them.
          docker run --rm --entrypoint sh zveltio-engine:ci -c \
            'test -f "$STUDIO_DIST_PATH/index.html" && test -f "$CLIENT_DIST_PATH/index.html" &&
             case "$STUDIO_DIST_PATH:$CLIENT_DIST_PATH" in /data*|*:/data*) exit 1;; esac'
          # The extension runner (compose overlay, Helm sidecar) drops uids with setpriv.
          docker run --rm --entrypoint setpriv zveltio-engine:ci --version >/dev/null
          # The binary runs and knows `migrate` (the chart's migration Job).
          docker run --rm zveltio-engine:ci --help | grep -q migrate
          # The PaaS image starts as root, so the entrypoint can start the
          # extension runner in the container and drop the engine to 100:101.
          [ "$(docker inspect -f '{{.Config.User}}' zveltio-engine:standalone)" = root ] \
            || { echo "::error::the default target does not start as root"; exit 1; }
          docker run --rm zveltio-engine:standalone --help | grep -q migrate

  compose-and-installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compose files parse
        # Users download the files generate-compose.sh writes at release, not
        # the repo's docker-compose.yml — parse both, plus the opt-in overlays.
        # The extension runner is in the generated files, not an overlay.
        env:
          POSTGRES_PASSWORD: x
          VALKEY_PASSWORD: x
          BETTER_AUTH_SECRET: x
          BETTER_AUTH_URL: http://localhost:3000
          DATABASE_URL: postgresql://zveltio:x@postgres:5432/zveltio
          VALKEY_URL: redis://:x@valkey:6379
          GRAFANA_ADMIN_PASSWORD: x
          S3_ACCESS_KEY: x
          S3_SECRET_KEY: x
          S3_ENDPOINT: http://seaweedfs:8333
          METRICS_TOKEN: x
          ELECTRIC_SECRET: x
        run: |
          docker compose -f docker-compose.yml config -q
          for o in ai dev electric; do
            docker compose -f docker-compose.yml -f "docker-compose.$o.yml" config -q
          done
          mkdir -p gen && bash scripts/generate-compose.sh 0.0.0-ci gen/
          for f in docker-compose.yml docker-compose.infra.yml docker-compose.engine.yml; do
            test -s "gen/$f" || { echo "::error::gen/$f was not generated"; exit 1; }
            docker compose -f "gen/$f" config -q
          done
      - name: Installer .env starts the compose file it downloads
        # The step above parses the generated files with every variable set in
        # the job's environment, so a variable the installer forgets to write
        # still parses there. Here the .env is the one scripts/install.sh writes
        # (run up to its download step: nothing is fetched or started), next to
        # the compose file Docker mode downloads, and nothing else is set.
        run: |
          sed '/^# ── Download fișiere/,$d' scripts/install.sh > /tmp/install-env-only.sh
          grep -q 'cat > .env' /tmp/install-env-only.sh || { echo "::error::install.sh no longer writes .env before its download step"; exit 1; }
          TERM=xterm bash /tmp/install-env-only.sh --version 0.0.0-ci --mode docker --unattended --dir /tmp/zv-install >/dev/null
          test -s /tmp/zv-install/.env || { echo "::error::the installer wrote no .env"; exit 1; }
          bash scripts/generate-compose.sh 0.0.0-ci /tmp/zv-install/
          cd /tmp/zv-install && env -i PATH="$PATH" HOME="$HOME" docker compose -f docker-compose.yml config -q
      - name: Installer syntax
        run: for f in install/*.sh scripts/install.sh; do bash -n "$f"; done
