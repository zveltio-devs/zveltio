name: Migration Safety

on:
  pull_request:
    paths:
      - 'packages/engine/src/db/migrations/sql/**'
      - 'scripts/check-migration-safety.ts'
      - '.github/workflows/migrate-safety.yml'

# Only one run per PR — re-running on every push wastes CI minutes.
concurrency:
  group: migrate-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Migration Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The gate diffs against the PR base to find migrations that are new
          # in this branch. Needs history for the merge-base.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - name: Install
        run: bun install --frozen-lockfile

      # Replaced Atlas here. The previous job passed `dir-name: zveltio-engine`,
      # an Atlas Cloud feature, so the action required `atlas login` and failed
      # before linting anything — 31 runs, 31 failures, on every branch. Its own
      # comment claimed Atlas "falls back to local linting" without a token; it
      # does not. Squawk needs no account and no database: it reads the SQL.
      #
      # The gate is also runnable locally, which the Atlas one never was:
      #   bun run scripts/check-migration-safety.ts
      #   bun run scripts/check-migration-safety.ts path/to/one.sql
      - name: Lint new migrations
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: bun run scripts/check-migration-safety.ts
