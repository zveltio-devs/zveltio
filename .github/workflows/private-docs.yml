name: Private Docs

# `docs/private/` must not be tracked in a public repository.
#
# It was, from 2026-07-20 until the history rewrite of 2026-09-09. Getting it
# back out cost a force-push across 905 tags and every open PR, and did not
# unpublish anything — GitHub traffic for the fortnight before showed 6,683
# clones from 671 unique clients. The `.gitignore` rule is the fix; this job is
# what notices when the rule stops working.
#
# Runs on every pull request rather than on a path filter: the failure modes are
# `git add -f`, a branch that predates the rule, a merge that resurrects the
# path, and an edit to `.gitignore` itself. A filter on `docs/private/**` would
# miss the last one, and the job costs seconds.

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: private-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  untracked:
    name: docs/private stays untracked
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      # No `bun install`: the gate shells out to git and imports nothing from
      # the workspace, so it runs before dependencies exist. That is deliberate
      # — a check on what the repository publishes should not be able to fail
      # because a dependency did.
      #
      # Runnable locally, against either repository:
      #   bun run scripts/check-private-docs-untracked.ts
      #   bun run scripts/check-private-docs-untracked.ts . ../zveltio-extensions
      - name: Check
        run: bun run scripts/check-private-docs-untracked.ts
