{{- /*
Engine secrets. Skipped when the user supplies `engine.existingSecret` —
that lets ops manage secrets externally (sealed-secrets, External Secrets
Operator, etc.) without churning the chart.

`stringData` lets us write plaintext; Kubernetes encodes to base64
internally. Helm's `nindent` preserves whatever indentation the user
provided in values.yaml for multi-line values.
*/ -}}
{{- if not .Values.engine.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zveltio.fullname" . }}-env
  labels:
    {{- include "zveltio.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "zveltio.databaseUrl" . | quote }}
  {{- with .Values.engine.config.nativeDatabaseUrl }}
  NATIVE_DATABASE_URL: {{ . | quote }}
  {{- end }}
  {{- /* The engine refuses to boot in production without a cache (startup-guards.ts). */}}
  {{- $valkey := include "zveltio.valkeyUrl" . }}
  {{- if $valkey }}
  VALKEY_URL: {{ $valkey | quote }}
  {{- else if ne (toString (index .Values.engine.config.extra "ZVELTIO_ALLOW_NO_CACHE")) "1" }}
  {{- fail "no cache configured: set redis.enabled=true or engine.config.valkeyUrl (or engine.config.extra.ZVELTIO_ALLOW_NO_CACHE=\"1\" to run without one deliberately) — the engine refuses to start in production otherwise" }}
  {{- end }}
  # required(): rendering an empty BETTER_AUTH_SECRET produced a deployment
  # that boots and signs sessions with nothing, which is worse than failing —
  # it looks healthy. `helm install` now stops until it is set.
  BETTER_AUTH_SECRET: {{ required "engine.config.betterAuthSecret is required — generate with: openssl rand -hex 32" .Values.engine.config.betterAuthSecret | quote }}
  # The engine refuses to boot in production without it (mail links, passkeys
  # and trusted origins are built from it).
  BETTER_AUTH_URL: {{ required "engine.config.betterAuthUrl is required — the URL browsers use, e.g. https://zveltio.example.com" .Values.engine.config.betterAuthUrl | quote }}
  {{- with .Values.engine.config.encryptionKey }}
  {{- if not (regexMatch "^[0-9a-fA-F]{64}$" .) }}
  {{- fail "engine.config.encryptionKey must be 64 hex characters (openssl rand -hex 32); the engine refuses anything else at boot" }}
  {{- end }}
  # Emitted as ENCRYPTION_KEY before, which the engine never read: encrypted
  # fields were refused on an install that believed it had set the key.
  FIELD_ENCRYPTION_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.engine.config.mailEncryptionKey }}
  MAIL_ENCRYPTION_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.engine.config.aiKeyEncryptionKey }}
  AI_KEY_ENCRYPTION_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.engine.config.metricsToken }}
  METRICS_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.engine.config.otelExporterOtlpEndpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ . | quote }}
  {{- end }}
  {{- with .Values.engine.config.registryPublicKeysJson }}
  REGISTRY_PUBLIC_KEYS_JSON: {{ . | quote }}
  {{- end }}
  {{- with .Values.engine.config.s3.endpoint }}
  S3_ENDPOINT: {{ . | quote }}
  S3_BUCKET: {{ $.Values.engine.config.s3.bucket | quote }}
  S3_REGION: {{ $.Values.engine.config.s3.region | quote }}
  # The engine reads S3_ACCESS_KEY / S3_SECRET_KEY (aws4fetch) — NOT the AWS-SDK
  # *_ID / *_ACCESS names this chart emitted before, which left S3 auth unset.
  S3_ACCESS_KEY: {{ $.Values.engine.config.s3.accessKeyId | quote }}
  S3_SECRET_KEY: {{ $.Values.engine.config.s3.secretAccessKey | quote }}
  {{- with $.Values.engine.config.s3.publicUrl }}
  S3_PUBLIC_URL: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
