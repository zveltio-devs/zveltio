{{- if .Values.networkPolicy.enabled }}
# Default-deny for the engine pods, with only the flows they actually need.
#
# Without any NetworkPolicy a compromised pod in the cluster can reach the
# engine, and the engine can reach anything — which turns an SSRF or an
# extension escape into lateral movement across the whole namespace. The engine
# already filters outbound URLs in application code; this is the layer below it,
# where that filtering cannot be bypassed by a bug in the filter.
#
# Disable with `networkPolicy.enabled=false` if your CNI does not enforce
# policies (they are silently ignored there, which is worse than not having
# them, because it looks like protection).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "zveltio.fullname" . }}
  labels:
    {{- include "zveltio.labels" . | nindent 4 }}
spec:
  # Engine pods only. The bundled postgres and valkey pods carry the same
  # selector labels, so without the component this policy also admitted
  # nothing but port 3000 to them and the engine could not reach its database.
  podSelector:
    matchLabels:
      {{- include "zveltio.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: engine
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # HTTP from the ingress controller (or anything the operator allows).
    - from:
        {{- if .Values.networkPolicy.ingressFrom }}
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
        {{- else }}
        - namespaceSelector: {}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.engine.service.port | default 3000 }}
  egress:
    # DNS — without this every other rule fails to resolve.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Postgres and Valkey: the bundled pods when the chart runs them, else the
    # peers the operator names (`networkPolicy.databaseTo` / `cacheTo`, e.g. the
    # managed instance's CIDR). Unnamed, an external one is reached at any
    # address: NetworkPolicy has no host names, and the default setup is an
    # external DATABASE_URL.
    {{- range $dep := list (dict "port" 5432 "bundled" .Values.postgresql.enabled "component" "postgres" "to" .Values.networkPolicy.databaseTo) (dict "port" 6379 "bundled" .Values.redis.enabled "component" "valkey" "to" .Values.networkPolicy.cacheTo) }}
    - ports:
        - protocol: TCP
          port: {{ $dep.port }}
      {{- if $dep.bundled }}
      to:
        - podSelector:
            matchLabels:
              {{- include "zveltio.selectorLabels" $ | nindent 14 }}
              app.kubernetes.io/component: {{ $dep.component }}
      {{- else if $dep.to }}
      to:
        {{- toYaml $dep.to | nindent 8 }}
      {{- end }}
    {{- end }}
    # HTTPS to any destination: the extension registry, webhooks, OAuth
    # providers, object stores. The ext-runner sidecar shares this pod's
    # network, so this is its policy too; what keeps an extension off the
    # network is the runner's seccomp socket ban (ADR 0023), which refuses
    # every socket family, not this policy.
    - ports:
        - protocol: TCP
          port: 443
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
