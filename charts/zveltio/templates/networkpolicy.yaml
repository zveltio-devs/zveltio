{{- if .Values.networkPolicy.enabled }}
# Default-deny for the engine pods, with only the flows they actually need.
#
# Without any NetworkPolicy a compromised pod in the cluster can reach the
# engine, and the engine can reach anything — which turns an SSRF or an
# extension escape into lateral movement across the whole namespace. The engine
# already filters outbound URLs in application code; this is the layer below it,
# where that filtering cannot be bypassed by a bug in the filter.
#
# Disable with `networkPolicy.enabled=false` if your CNI does not enforce
# policies (they are silently ignored there, which is worse than not having
# them, because it looks like protection).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "zveltio.fullname" . }}
  labels:
    {{- include "zveltio.labels" . | nindent 4 }}
spec:
  # Engine pods only. The bundled postgres and valkey pods carry the same
  # selector labels, so without the component this policy also admitted
  # nothing but port 3000 to them and the engine could not reach its database.
  podSelector:
    matchLabels:
      {{- include "zveltio.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: engine
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # HTTP from the ingress controller (or anything the operator allows).
    - from:
        {{- if .Values.networkPolicy.ingressFrom }}
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
        {{- else }}
        - namespaceSelector: {}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.engine.service.port | default 3000 }}
  egress:
    # DNS — without this every other rule fails to resolve.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # In-namespace dependencies (Postgres, Valkey).
    # Database, cache and HTTPS to any destination. `to: podSelector: {}`
    # meant pods in this namespace only, which blocked the default setup — an
    # external DATABASE_URL — and the extension registry, which the engine
    # downloads extensions from on demand.
    - ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 443
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
